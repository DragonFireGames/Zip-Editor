<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Zip Editor</title>
  <style>
    body { margin:0; font-family:sans-serif; background:#111; color:#eee; }
    #toolbar { padding:8px; background:#222; border-bottom:1px solid #333; }
    #toolbar { display: flex; justify-content: space-between; align-items: center; padding: 4px; background: #222; border-bottom: 1px solid #333; }
    .toolbar-left, .toolbar-right { display: flex; gap: 0px; }
    .toolbar-center { flex: 1; text-align: center; }
    .tooltip { display: block; background: #111; border: 1px solid grey; border-radius: 2px; position: absolute; top: 100%; left: 0px; z-index: 1000; color: #eee; visibility: hidden; padding: 2px; }
    #projectName { font-weight: bold; }
    #toolbar button { margin-left:4px; }
    #main { display:flex; height:calc(100vh - 32px); }
    #tree { width:15%; overflow:auto; border-right:1px solid #333; padding:8px; }
    #tree.draghover { background: #444; }
    #tree > ul { white-space: nowrap; overflow-x: scroll; }
    #editorPane { width:50%; display:flex; flex-direction:column; position: relative; }
    #editorContainer { position: relative; flex: 1; min-height:300px; }
    .editor { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: none; }
    .editor.active { display: block; }
    .editorHead { top: 0; display: block; height: 20px; background: #222; }
    .editorBody { position: absolute; top: 20px; left: 0; right: 0; bottom: 0; display: none; }
    .editorBody.active { display: block; }
    .editorTab { background #111; border: 1px solid; border-radius: 2px; margin: 2px; cursor: pointer; color: grey; }
    .editorTab.active { background #333; color: #eee; }
    .editorText { padding-left: 5px; }
    .rawedit { width: calc(100% - 5px); height: calc(100% - 5px); background: #222; color: #fff; border: none; resize: none; }
    #tabBar { display: flex; background: #222; border-bottom: 1px solid #333; overflow-x: auto; }
    .tab { padding: 6px 23px 6px 12px; background: #333; color: #eee; cursor: pointer; user-select: none; margin-right: 2px; position: relative; }
    .tab.active { background: #444; font-weight: bold; }
    .tab .close { position: absolute; right: 6px; top: 4px; cursor: pointer; color: #aaa; }
    .tab .close:hover { color: red; }
    #previewPane { width:35%; display:flex; flex-direction:column; border-left:1px solid #333; }
    #previewFrame { height: 66%; border:none; background:#fff; }
    #previewFrame.fullscreen { position: absolute; display: block; width: 100%; height: calc(100vh - 30px); z-index: 10; }
    #previewToolbar { background: #222; border-top: 1px solid #333; border-bottom: 1px solid #333; padding: 3px; display: flex; gap: 4px; justify-content: center; }
    #previewToolbar button, #toolbar button { background: #333; color: #eee; border: 1px solid #444; padding: 2px 4px; cursor: pointer; }
    #previewToolbar button:hover, #toolbar button:hover { background: #444; }
    #console { height: 34%; background:#0a0a0a; color:#aaa; font-family:monospace; display:flex; flex-direction:column; overflow-y: scroll; }
    #console.fullscreen { height: 100%; }
    #consoleOutput { flex:1; overflow:auto; padding:4px; }
    #consoleInputRow { display:flex; border-top:1px solid #333; }
    #consoleInput { flex:1; background:#111; color:#0f0; border:none; padding:6px; font-family:monospace; }
    #sendBtn { background:#222; color:#0f0; border:none; padding:6px 12px; cursor:pointer; }
    #tree ul { list-style:none; padding-left:16px; margin:0; }
    #tree li { cursor:pointer; margin:2px 0; padding: 2px 4px; }
    #tree li:hover:not(:has(li:hover)), li.draghover { background:#333; }
    #tree svg { display: inline-block; height: 1em; padding-right: 2px; }
    #treebuttons { padding-left: 10px; }
    #treebuttons button { display: inline-block; background: none; border: none; border-radius: 2px; position: relative; }
    #treebuttons button:hover { background: #222; }
    #treebuttons button:hover .tooltip { visibility: visible; }
    .collapsed > ul { display:none; }
    .arrow { display:inline-block; width:1em; cursor:pointer; }
    .context-menu { position:absolute; background:#222; border:1px solid #555; display:none; z-index:1000; }
    .context-menu ul { list-style:none; margin:0; padding:4px; }
    .context-menu li { padding:4px 8px; cursor:pointer; }
    .context-menu li:hover { background:#444; }
    .modal { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); display:none; align-items:center; justify-content:center;  z-index:1000; }
    .modal-content { position: relative; background:#222; padding:20px; border:1px solid #555; text-align:center; }
    .close { position: absolute; top: 8px; right: 12px; font-size: 20px; color: #aaa; cursor: pointer; }
    .close:hover { color: #fff; }
    .dropzone { border:2px dashed #555; padding:40px; color:#aaa; cursor: pointer; }
    #resizer, #resizer2 { width: 3px; cursor: col-resize; background: #444; border: #fff; display: inline-block; z-index: 1; }
    #resizer3 { height: 3px; cursor: row-resize; background: #444; border: #fff; display: block; z-index: 1; }
    body.resizing, body.resizing * { user-select: none; }
    .dropdown { position: relative; display: inline-block; font-family:monospace; }
    .dropdown-content { display: none; position: absolute; background: #222; min-width: 220px; border: 1px solid #555; padding: 4px; z-index: 1000; left: -210px; }
    .dropdown-content label { margin-left: 6px; display: block; margin-bottom: 8px; color: #eee; }
    .dropdown-content input { background: #111; color: #0f0; border: 1px solid #444; padding: 2px 4px; }
    .img-display { max-width: 100%; max-height: 90%; }
    .piskelEmbed { flex:1; border:none; width: 100%; height: 100%; display: flex; }
    .log { display: inline; line-height: inherit; vertical-align: top; margin: 0; padding: 0; }
    .log-number { color: dodgerblue; }
    .log-string { color: forestgreen; white-space: pre-wrap; }
    .log-boolean { color: darkorange; }
    .log-null, .log-undefined, .log-empty { color: grey; font-style: italic; }
    .log-property { color: #aaa; }
    .log-class { color: teal; font-weight: bold; }
    .log-function { color: crimson; }
    .log-function-source { color: grey; }
    .log-dropdown { display: inline-block; margin: 0 4px; }
    .log-html { color: salmon; }
    .log-command { color: #0f0; }
    .log-error { color: red; background: #ff000010; }
    .log-warning { color: yellow; background: #ffff0010; }
    .log-details { display: inline-block; margin: 0 4px 0 0; }
    .log-promise { color: violet; font-style: italic; }
    .log-circular, .log-promise-rejected { color: red; font-style: italic; }
    .log-url { text-decoration: underline; cursor: pointer; }
    .log-url:hover { text-decoration: bold underline; }
  </style>
  <link rel="manifest" href="data:application/json;base64,ewogICAgIm5hbWUiOiAiWmlwIEVkaXRvciIsCiAgICAic2hvcnRfbmFtZSI6ICJaRWRpdCIsCiAgICAic3RhcnRfdXJsIjogIi8iLAogICAgImRpc3BsYXkiOiAic3RhbmRhbG9uZSIsCiAgICAiYmFja2dyb3VuZF9jb2xvciI6ICIjZmZmZmZmIiwKICAgICJ0aGVtZV9jb2xvciI6ICIjMDAwMDAwIiwKICAgICJpY29ucyI6IFtdCn0=">
  <script src="https://cdn.jsdelivr.net/npm/gl-matrix@3.4.3/gl-matrix-min.js"></script>
</head>
<body>
  <div id="toolbar">
    <div class="toolbar-left">
      <button id="uploadZipBtn">Upload ZIP</button>
      <button id="newZipBtn">New Project</button>
    </div>
    <div class="toolbar-center">
      <span id="projectName">Untitled Project</span>
    </div>
    <div class="toolbar-right">
      <button id="fullscreenToggle">Fullscreen</button>
      <button id="saveZipBtn">Save ZIP</button>
      <button id="savePreviewBtn">Export Preview</button>
      <div class="dropdown">
        <button id="settingsBtn">⚙️</button>
        <div id="settingsMenu" class="dropdown-content">
          <label>
            Run Path:
            <input type="text" id="runPathSetting" />
          </label>
          <label>
            Clear on Run:
            <input type="checkbox" id="autoClear" />
          </label>
          <label>
            Save on Run:
            <input type="checkbox" id="autoSave" />
          </label>
          <!--<label>
            Tab Spaces:
            <input type="number" id="tabSpaceSetting" min="1" max="8" />
          </label>
          <label>
            Auto Start:
            <input type="checkbox" id="autoStart" />
          </label>-->
        </div>
      </div>
    </div>
  </div>
  <div id="main">
    <div id="tree"></div>
    <div id="resizer"></div>
    <div id="editorPane">
      <div id="tabBar"></div>
      <div id="editorContainer"></div>
    </div>
    <div id="resizer2"></div>
    <div id="previewPane">
      <iframe id="previewFrame"></iframe>
      <div id="resizer3"></div>
      <div id="previewToolbar">
        <div class="toolbar-center">
        <button id="runBtn" onclick="runPreview()">Run</button>
        <button id="resetBtn">Reset</button>
        </div>
        <div class="toolbar-right">
          <button id="clearBtn">Clear</button>
        </div>
      </div>
      <div id="console">
        <div id="consoleOutput"></div>
        <div id="consoleInputRow">
          <input id="consoleInput" placeholder="Enter command..." autocorrect="off" autocapitalize="off" autocomplete="off" spellcheck="false"/>
          <button id="sendBtn">Send</button>
        </div>
      </div>
    </div>
  </div>

  <div id="contextMenu" class="context-menu">
    <ul>
      <li data-action="rename">Rename</li>
      <li data-action="delete">Delete</li>
      <li data-action="flatten">Flatten</li>
      <li data-action="copyFile">Copy</li>
      <li data-action="download">Download</li>
      <li data-action="newFile">New File</li>
      <li data-action="newFolder">New Folder</li>
      <li data-action="upload">Upload File</li>
    </ul>
  </div>
  <input type="file" id="fileUploader" style="display:none"/>

  <!-- Modal for zip upload -->
  <div id="zipModal" class="modal">
    <div class="modal-content">
      <span id="closeZipModal" class="close">&times;</span>
      <h2>Upload ZIP</h2>
      <div id="dropzone" class="dropzone">Drag & Drop ZIP file here</div>
      <input type="file" id="zipInput" accept=".zip" style="display:none"/>
    </div>
  </div>

      //Code ported by Marcin Ignac (2014)
//Based on Java implementation from
//https://code.google.com/r/cys12345-research/source/browse/hdr/image_processor/RGBE.java?r=7d84e9fd866b24079dbe61fa0a966ce8365f5726
var radiancePattern = "#\\?RADIANCE"
var commentPattern = "#.*"
var gammaPattern = "GAMMA=";
var exposurePattern = "EXPOSURE=\\s*([0-9]*[.][0-9]*)";
var formatPattern = "FORMAT=32-bit_rle_rgbe";
var widthHeightPattern = "-Y ([0-9]+) \\+X ([0-9]+)";

//http://croquetweak.blogspot.co.uk/2014/08/deconstructing-floats-frexp-and-ldexp.html
function ldexp(mantissa, exponent) {
    return exponent > 1023 // avoid multiplying by infinity
        ? mantissa * Math.pow(2, 1023) * Math.pow(2, exponent - 1023)
        : exponent < -1074 // avoid multiplying by zero
        ? mantissa * Math.pow(2, -1074) * Math.pow(2, exponent + 1074)
        : mantissa * Math.pow(2, exponent);
}

function readPixelsRawRLE(buffer, data, offset, fileOffset, scanline_width, num_scanlines) {
    var rgbe = new Array(4);
    var scanline_buffer = null;
    var ptr;
    var ptr_end;
    var count;
    var buf = new Array(2);
    var bufferLength = buffer.length;

    function readBuf(buf) {
      var bytesRead = 0;
      do {
        buf[bytesRead++] = buffer[fileOffset];
      } while(++fileOffset < bufferLength && bytesRead < buf.length);
      return bytesRead;
    }

    function readBufOffset(buf, offset, length) {
      var bytesRead = 0;
      do {
        buf[offset + bytesRead++] = buffer[fileOffset];
      } while(++fileOffset < bufferLength && bytesRead < length);
      return bytesRead;
    }

    function readPixelsRaw(buffer, data, offset, numpixels) {
        var numExpected = 4 * numpixels;
        var numRead = readBufOffset(data, offset, numExpected);
        if (numRead < numExpected) {
            throw new Error('Error reading raw pixels: got ' + numRead + ' bytes, expected ' + numExpected);
        }
    }

    while (num_scanlines > 0) {
      if (readBuf(rgbe) < rgbe.length) {
        throw new Error("Error reading bytes: expected " + rgbe.length);
      }

      if ((rgbe[0] != 2)||(rgbe[1] != 2)||((rgbe[2] & 0x80) != 0)) {
          //this file is not run length encoded
          data[offset++] = rgbe[0];
          data[offset++] = rgbe[1];
          data[offset++] = rgbe[2];
          data[offset++] = rgbe[3];
          readPixelsRaw(buffer, data, offset, scanline_width*num_scanlines-1);
          return;
      }

      if ((((rgbe[2] & 0xFF)<<8) | (rgbe[3] & 0xFF)) != scanline_width) {
        throw new Error("Wrong scanline width " + (((rgbe[2] & 0xFF)<<8) | (rgbe[3] & 0xFF)) + ", expected " + scanline_width);
      }

      if (scanline_buffer == null) {
        scanline_buffer = new Array(4*scanline_width);
      }

      ptr = 0;
      /* read each of the four channels for the scanline into the buffer */
      for (var i=0; i<4; i++) {
        ptr_end = (i+1)*scanline_width;
        while(ptr < ptr_end) {
          if (readBuf(buf) < buf.length) {
            throw new Error("Error reading 2-byte buffer");
          }
          if ((buf[0] & 0xFF) > 128) {
            /* a run of the same value */
            count = (buf[0] & 0xFF) - 128;
            if ((count == 0) || (count > ptr_end - ptr)) {
              throw new Error("Bad scanline data");
            }
            while(count-- > 0)
              scanline_buffer[ptr++] = buf[1];
          }
          else {
            /* a non-run */
            count = buf[0] & 0xFF;
            if ((count == 0) || (count > ptr_end - ptr)) {
              throw new Error("Bad scanline data");
            }
            scanline_buffer[ptr++] = buf[1];
            if (--count > 0) {
              if (readBufOffset(scanline_buffer, ptr, count) < count) {
                throw new Error("Error reading non-run data");
              }
              ptr += count;
            }
          }
        }
      }

      /* copy byte data to output */
      for(var i = 0; i < scanline_width; i++) {
        data[offset + 0] = scanline_buffer[i];
        data[offset + 1] = scanline_buffer[i+scanline_width];
        data[offset + 2] = scanline_buffer[i+2*scanline_width];
        data[offset + 3] = scanline_buffer[i+3*scanline_width];
        offset += 4;
      }

      num_scanlines--;
    }

}

//Returns data as floats and flipped along Y by default
function parseHdr(buffer) {
    if (buffer instanceof ArrayBuffer) {
        buffer = new Uint8Array(buffer);
    }

    var fileOffset = 0;
    var bufferLength = buffer.length;

    var NEW_LINE = 10;

    function readLine() {
        var buf = "";
        do {
            var b = buffer[fileOffset];
            if (b == NEW_LINE) {
                ++fileOffset
                break;
            }
            buf += String.fromCharCode(b);
        } while(++fileOffset < bufferLength);
        return buf;
    }

    var width = 0;
    var height = 0;
    var exposure = 1;
    var gamma = 1;
    var rle = false;

    for(var i=0; i<20; i++) {
        var line = readLine();
        var match;
        if (match = line.match(radiancePattern)) {
        }
        else if (match = line.match(formatPattern)) {
            rle = true;
        }
        else if (match = line.match(exposurePattern)) {
            exposure = Number(match[1]);
        }
        else if (match = line.match(commentPattern)) {
        }
        else if (match = line.match(widthHeightPattern)) {
            height = Number(match[1]);
            width = Number(match[2]);
            break;
        }
    }

    if (!rle) {
        throw new Error("File is not run length encoded!");
    }

    var data = new Uint8Array(width * height * 4);
    var scanline_width = width;
    var num_scanlines = height;

    readPixelsRawRLE(buffer, data, 0, fileOffset, scanline_width, num_scanlines);

    //TODO: Should be Float16
    var floatData = new Float32Array(width * height * 4);
    for(var offset=0; offset<data.length; offset += 4) {
        var r = data[offset+0]/255;
        var g = data[offset+1]/255;
        var b = data[offset+2]/255;
        var e = data[offset+3];
        var f = Math.pow(2.0, e - 128.0)

        r *= f;
        g *= f;
        b *= f;

        var floatOffset = offset;

        floatData[floatOffset+0] = r;
        floatData[floatOffset+1] = g;
        floatData[floatOffset+2] = b;
        floatData[floatOffset+3] = 1.0;
    }

    return {
        shape: [width, height],
        exposure: exposure,
        gamma: gamma,
        data: floatData
    }
}

let fullscreenToggle = document.getElementById("fullscreenToggle");
fullscreenToggle.on = false;
fullscreenToggle.addEventListener('click',()=>{
  var tree = document.getElementById('tree');
  var editorPane = document.getElementById('editorPane');
  var previewPane = document.getElementById('previewPane');
  var frame = document.getElementById('previewFrame');
  var consoleDiv = document.getElementById('console');

    tree.style.visibility = "hidden";

    fullscreenToggle.textContent = "Fullscreen";
  }
  fullscreenToggle.on = !fullscreenToggle.on;

var settingsController = new (class {
  constructor() {
    this.settings = {};
    this.elements = {};
  }
  setupText(id, key = id) {
    const elem = document.getElementById(id);
    if (!elem) return;

    this.settings[key] = elem.value;
    this.elements[key] = elem;

    elem.addEventListener("input", () => {
      this.settings[key] = elem.value;
      this.saveConfig();
    });
  }
  setupCheckbox(id, key = id) {
    const elem = document.getElementById(id);
    if (!elem) return;

    this.settings[key] = elem.checked;
    this.elements[key] = elem;

    elem.addEventListener("change", () => {
      this.settings[key] = elem.checked;
      this.saveConfig();
    });
  }
  setupNumber(id, key = id) {
    const elem = document.getElementById(id);
    if (!elem) return;

    this.settings[key] = parseInt(elem.value, 10);
    this.elements[key] = elem;

    elem.addEventListener("input", () => {
      this.settings[key] = parseInt(elem.value, 10);
      this.saveConfig();
    });
  }
  updateProperty(key, value) {
    this.settings[key] = value;

    const elem = this.elements[key];
    if (elem) {
      if (elem.type === "checkbox") {
        elem.checked = !!value;
      } else {
        elem.value = value;
      }
    }

    this.saveConfig();
  }
  getProperty(key) {
    return this.settings[key];
  }
  async saveConfig() {
    if (!zip) return;
    const json = JSON.stringify(this.settings, null, 2);
    await zip.file("preview-config.json", json);
    
    // keep fileMap in sync
    const base64 = btoa(unescape(encodeURIComponent(json)));
    zip.fileMap["preview-config.json"] = `data:application/json;base64,${base64}`;
  }
  async loadConfig() {
    if (!zip) return;
    const entry = zip.file("preview-config.json");
    if (!entry) return this.saveConfig();
    const text = await entry.async("string");
    this.updateSettings(JSON.parse(text));
  }
  updateSettings(obj) {
    // push values back into inputs
    for (const key in obj) {
      this.settings[key] = obj[key];
      const elem = this.elements[key];
      if (!elem) continue;
      if (elem.type === "checkbox") {
        elem.checked = obj[key];
      } else {
        elem.value = obj[key];
      }
    }
    this.saveConfig();
  }
})();

  if (!settingsBtn.contains(e.target) && !settingsMenu.contains(e.target)) {

  const textExts = ["css", "js", "html"];
  
  async function generateFile(path, entry, parents) {
    if (fileMap[path]) return;
    if (entry.dir) { delete fileMap[path]; return; }
  
    const ext = path.split(".").pop().toLowerCase();
  
    // Non-text files → base64 data URI
    if (!textExts.includes(ext)) {
      //const blob = await entry.async("blob");
      //fileMap[path] = URL.createObjectURL(blob);
      const mime = inferMime(entry.name);
      const base64 = await entry.async("base64");
      fileMap[path] = `data:${mime};base64,${base64}`;
      return;
    }
  
    // Text files → rewrite references
    let content = await entry.async("string");
    
    if (ext == "js") {
      content = content.replace(/\bimport\s*\(/g, 'requireModule(');
    }
    
    const baseDir = path.includes("/") ? path.slice(0, path.lastIndexOf("/") + 1) : "";
    const regex = ext === "css" ? (/url\((["']?)([^)]*)\1\)/g) : (/(["'`])([^"'`]*)\1/g);
    let result = "";
    let lastIndex = 0;
  
    let match;
    while ((match = regex.exec(content)) !== null) {
      var [full, quote, ref] = match;
      var endquote = quote;
      if (ext === "css") {
        endquote = quote+")";
        quote = "url("+quote; 
      }
      const resolved = resolveRelative(ref, baseDir);
  
      result += content.slice(lastIndex, match.index);
  
      if (!parents.includes(resolved) && zipFile.file(resolved)) {
        if (!fileMap[resolved]) {
          await generateFile(resolved, zipFile.file(resolved), parents.concat(resolved));
        }
        if (fileMap[resolved]) {
          result += quote + fileMap[resolved] + endquote;
        } else {
          result += full;
        }
      } else {
        result += full;
      }
  
      lastIndex = regex.lastIndex;
    }

    result += content.slice(lastIndex);

    // Encode text content as base64 data URI
    const mime = "text/"+ext;
    const base64 = btoa(unescape(encodeURIComponent(result)));
    fileMap[path] = `data:${mime};base64,${base64}`;
    //const blob = new Blob([result], { type: "text/" + ext });
    //fileMap[path] = URL.createObjectURL(blob);
  }
  
  var runfile = settingsController.getProperty("runPath");
  if (fileMap[runfile]) await generateFile(runfile,zip.file(runfile),[runfile]);
  
  for (const [path, entry] of Object.entries(zipFile.files)) {
    await generateFile(path,entry,[path]);
  }
  zipFile.fileMap = fileMap;
  
  resetFileMap = false;
}

const supportsFSAPI = 'showOpenFilePicker' in window;
let currentFileHandle = null;
async function openZipWithFSAPI() {
  try {
    const [handle] = await window.showOpenFilePicker({
      types: [{
        description: 'ZIP files',
        accept: { 'application/zip': ['.zip'] }
      }]
    });
    currentFileHandle = handle; // store the handle for later saves
    const file = await handle.getFile();
    await openZipFile(file);
  } catch (err) {
    logError("Failed to open zip: " + err);
  }
}
async function saveZipFileFSAPI(blob,name,useHandle) {
  try {
    if (!currentFileHandle || !useHandle) {
      // fallback: ask user where to save if no file was opened
      currentFileHandle = await window.showSaveFilePicker({
        suggestedName: name+'.zip',
        types: [{
          description: 'ZIP file',
          accept: { 'application/zip': ['.zip'] }
        }]
      });
    }
    
    if (currentFileHandle.name != name+'.zip') {
      await currentFileHandle.move(name+'.zip');
    }

    const writable = await currentFileHandle.createWritable();
    await writable.write(blob);
    await writable.close();
  } catch (err) {
    logError("Save error: " + err);
  }
}

  zip.fileMap = {};
  const projectName=file.name.replace(/\.zip$/,'');

async function openProject(zip,projectName) {
  const nameSpan=document.getElementById('projectName');
  nameSpan.textContent=projectName;
  nameSpan.onclick=()=>{
    const newName=prompt('Rename project:',nameSpan.textContent);
    if(newName) nameSpan.textContent=newName;
  };
  await buildFileMap(zip);
  buildTreeFromZip(zip);renderTree();
  unsavedChanges = false;
  document.getElementById('consoleOutput').textContent='';
  document.getElementById('previewFrame').srcdoc = '';
  document.getElementById('editorContainer').innerHTML = '';
  // Close all tabs
  if (openTabs) {
    for (const path in openTabs) {
      const { tabEl, editorEl, monacoInstance } = openTabs[path];
      if (monacoInstance) monacoInstance.dispose();
      if (tabEl) tabEl.remove();
      if (editorEl) editorEl.remove();
    }
  }
  openTabs = {};
  activeTab = null;
  document.getElementById('zipModal').style.display='none';
}

// Tree building
function buildTreeFromZip(zip) {
  root.children = [];
  nodeByPath.clear();
  nodeByID.clear();

  zip.forEach((relativePath, entry) => {
    const parts = relativePath.split('/');
    let cursor = root, currPath = '';

    for (let i = 0; i < parts.length; i++) {
      const name = parts[i];
      if (!name) continue;

      const isLast = i === parts.length - 1;
      currPath = i === 0 ? name : `${currPath}/${name}`;
      const isDir = (!isLast) || entry.dir;

      if (isLast && !isDir && (name.toLowerCase().endsWith('.piskel') || name.toLowerCase() == "preview-config.json")) {
        return;
      }

      let child = cursor.children.find(c => c.name === name && c.isDir === isDir);
      if (!child) {
        child = {
          id: crypto.randomUUID(),
          name,
          path: currPath,
          isDir,
          children: isDir ? [] : undefined,
          mime: isDir ? undefined : inferMime(name)
        };
        cursor.children.push(child);
        nodeByPath.set(child.path, child);
        nodeByID.set(child.id, child);
      }
      cursor = child;
    }
  });

  sortTree(root);
}
function sortTree(node) {
  if (!node.children) return;
  node.children.sort((a,b)=>a.isDir!==b.isDir?(a.isDir?-1:1):
  a.name.localeCompare(b.name));
  node.children.forEach(sortTree);
}
function inferMime(name) {
  if (name == "LICENSE") return "text/plain";
  const ext = name.split('.').pop()?.toLowerCase();
  const map = {
    'txt':'text/plain',
    'md':'text/markdown',
    'js':'text/javascript',
    'ts':'text/typescript',
    'json':'application/json',
    'html':'text/html',
    'css':'text/css',
    'png':'image/png',
    'jpg':'image/jpeg',
    'jpeg':'image/jpeg',
    'gif':'image/gif',
    'webp':'image/webp',
    'avif':'image/avif',
    'hdr':'image/vnd.radiance',
    'exr':'image/x-exr',
    'svg':'image/svg+xml',
    'mp3':'audio/mpeg',
    'wav':'audio/wav',
    'ogg':'audio/ogg',
    'mp4':'video/mp4',
    'webm':'video/webm',
    'obj':'model/obj',
    'fbx':'model/x-fbx',
    'glb':'model/gltf-binary',
    'gltf':'model/gltf+json',
    'mtl':'text/plain',
    'frag':'text/x-hlsl',
    'vert':'text/x-hlsl',
    'hlsl':'text/x-hlsl',
    'fx':'text/x-hlsl',
    'wgsl':'text/wgsl',
    'py':'text/x-python',
    'c':'text/x-c',
    'cpp':'text/x-c'
  };
  return map[ext]||'application/octet-stream';
}

function renderNode(node) {
  const ul=document.createElement('ul');
  node.children?.forEach(child=>{
    const li=document.createElement('li');
    li.innerHTML += renderIcon(child.name,child.isDir);
    if (child.isDir){
      const arrow=document.createElement('span');arrow.textContent='▼';arrow.className='arrow';
      arrow.addEventListener('click',e=>{
        e.stopPropagation(); 
        li.classList.toggle('collapsed');
        arrow.textContent = li.classList.contains('collapsed') ? '▶' : '▼';
      });
      li.prepend(arrow);
    }
    li.appendChild(document.createTextNode(child.name + (child.isDir ? '/' : '')));
    li.dataset.path = child.path;

    // Click opens preview
    li.addEventListener('click', (e) => {
      e.stopPropagation();
      selectedNode = child;
      openFileEditor(child);
    });

    // Context menu
    li.addEventListener('contextmenu', (e) => {
      if (e.target !== li) return;
      e.preventDefault();
      selectedNode = child;
      showContextMenu(e.pageX, e.pageY);
    });

    // Drag & drop
    li.draggable = true;
    li.addEventListener('dragstart', (e) => {
        if (e.target !== li) return;
      e.dataTransfer.setData('text/plain', child.path);
    });
    li.addEventListener('dragover', (e) => {
        if (e.target !== li) return;
      li.classList.add("draghover");
      e.preventDefault();
    });
    li.addEventListener('dragleave', (e) => {
      li.classList.remove("draghover");
    });
    li.addEventListener('drop', async (e) => {
        if (e.target !== li) return;
      li.classList.remove("draghover");
      e.preventDefault();
      const files = e.dataTransfer.files;
      if (files.length > 0) {
        await uploadFiles(files, child);
        return;
      }
      const srcPath = e.dataTransfer.getData('text/plain');
      if (srcPath && srcPath !== child.path) {
        await handleMove(srcPath, child);
      }
    });

    // Render children
    if (child.isDir) {
      li.appendChild(renderNode(child));
    }
    ul.appendChild(li);
  });
  return ul;
}
function collapseAll() {
  // Select all folder <li> elements (those that contain an arrow)
  const folderItems = document.querySelectorAll('#tree li:has(.arrow)');

  folderItems.forEach(li => {
    li.classList.add('collapsed');
    const arrow = li.querySelector('.arrow');
    if (arrow) arrow.textContent = '▶';
  });
}

function showContextMenu(x,y){
  const menu=document.getElementById('contextMenu');
  menu.style.left=x+'px';
  menu.style.top=y+'px';
  menu.style.display='block';
  var list = menu.children[0].children;
  list[0].style.display = selectedNode ? "block": "none";
  list[1].style.display = selectedNode ? "block": "none";
  list[2].style.display = (selectedNode && selectedNode.isDir) ? "block": "none";
  list[3].style.display = (selectedNode && !selectedNode.isDir) ? "block": "none";
  list[4].style.display = (selectedNode && !selectedNode.isDir) ? "block": "none";
}
document.body.addEventListener('click',()=>{document.getElementById('contextMenu').style.display='none';});
document.querySelectorAll('#contextMenu li').forEach(item=>{
  item.addEventListener('click',()=>{
    const action=item.dataset.action;
    if (action === 'newFile') {
      const name = prompt('File name:');
      if (name) createFile(selectedNode,name);
    }
    if (action === 'newFolder') {
      const name=prompt('Folder name:');
      if (name) createFolder(selectedNode,name);
    }
    if (action === 'upload') {
      document.getElementById("fileUploader").click();
    }
    if (!selectedNode) return;
    if (action === 'copyFile') {
      var n = 1;
      var name = selectedNode.name.substr(0,selectedNode.name.lastIndexOf("."));
      var ext = selectedNode.name.split(".").pop();
      while (zip.file(name+` (${n}).`+ext)) n++;
      //const newName=prompt('Copy name:',selectedNode.name+` (${n})`);
      // if(newName) copyNode(selectedNode,newName);
      copyNode(selectedNode,name+` (${n}).`+ext);
    }
    if (action === 'rename') {
      const newName = prompt('New name:',selectedNode.name);
      if (newName && selectedNode.name !== newName) renameNode(selectedNode,newName);
    }
    if (action === 'delete') {
      deleteNode(selectedNode);
    }
    if (action === 'flatten') {
      flattenNode(selectedNode);
    }
    if (action === 'download') {
      downloadNode(selectedNode);
    }
  });
});

document.getElementById("fileUploader").addEventListener('change',async e=>{
  try{
    const files=e.target.files;
    uploadFiles(files,selectedNode?selectedNode:root);
  } catch(err) {logText("Failed to load zip: "+err);}
});

async function copyFile(oldPath, newPath) {
  const entry = zip.file(oldPath);
  if (!entry) return true;
  const content = await entry.async('uint8array');
  if (content) zip.file(newPath, content);
  zip.fileMap[newPath] = zip.fileMap[oldPath];
}
async function moveFile(oldPath,newPath) {
  if (zip[newPath] && !confirm("File "+newPath+" already exists. Replace it?")) return; 
  if (nodeByPath.get(oldPath)) nodeByPath.get(oldPath).path = newPath;
  if (await copyFile(oldPath,newPath)) return;
  zip.remove(oldPath);
  delete zip.fileMap[oldPath];
}
async function movePath(oldPath, newPath, isDir = false) {
  if (oldPath == newPath) return;
  if (!isDir) {
    await Promise.all([
      moveFile(oldPath, newPath),
      moveFile(oldPath + ".piskel", newPath + ".piskel")
    ]);
    updateTab(oldPath, newPath);
  } else {
    const waiton = [];
    zip.forEach(p => {
      if (p == oldPath+'/') return;
      if (!p.startsWith(oldPath + '/')) return;
      if (p.endsWith(".piskel")) return;
      const rel = p.slice(oldPath.length);
      const newP = newPath + rel;
      waiton.push(moveFile(p, newP));
      waiton.push(moveFile(p + ".piskel", newP + ".piskel"));
      updateTab(p, newP);
    });
    await Promise.all(waiton);
    zip.remove(oldPath);
  }
  buildTreeFromZip(zip);
  renderTree();
}

async function copyNode(node, copyName) {
  const oldPath = node.path;
  const parentPath = oldPath.includes('/') ? oldPath.slice(0, oldPath.lastIndexOf('/')) : '';
  const newPath = parentPath ? `${parentPath}/${copyName}` : copyName;

  // copy main file and its .piskel sidecar
  await Promise.all([
    copyFile(oldPath, newPath),
    copyFile(oldPath + ".piskel", newPath + ".piskel")
  ]);
  
  await buildFileMap(zip);
  unsavedChanges = true;
  buildTreeFromZip(zip);
  renderTree();
}
async function renameNode(node, newName) {
  const oldPath = node.path;
  const parentPath = oldPath.includes('/') ? oldPath.slice(0, oldPath.lastIndexOf('/')) : '';
  const newPath = parentPath ? `${parentPath}/${newName}` : newName;

  await movePath(oldPath, newPath, node.isDir);
}
async function deleteNode(node, confirmation) {
  if (!confirmation && !confirm(`Are you sure you want to delete ${node.path}? This action is permanent.`)) return;

  zip.remove(node.path);
  zip.remove(node.path + ".piskel");

  // update fileMap
  delete zip.fileMap[node.path];
  delete zip.fileMap[node.path + ".piskel"];

  // remove from nodeByPath
  nodeByPath.delete(node.path);

  // Remove from parent children
  const parentPath = node.path.includes('/') ? node.path.slice(0, node.path.lastIndexOf('/')) : '';
  const parentNode = nodeByPath.get(parentPath) || root;
  if (parentNode && parentNode.children) {
    parentNode.children = parentNode.children.filter(c => c !== node);
  }

  // Remove DOM element
  const li = document.querySelector(`li[data-path="${node.path}"]`);
  if (li) li.remove();

  // Close tab if open
  if (openTabs[node.path]) closeTab(node.path);

  if (!node.isDir) return;
  const base = node.path.endsWith('/') ? node.path : node.path + '/'; 
  zip.forEach(p => { 
    if (!p.startsWith(base)) return; 
    if (p === base) return; 
    if (p.endsWith('.piskel')) return; 
    zip.remove(p); 
    zip.remove(p + ".piskel"); 
    delete zip.fileMap[p]; 
    delete zip.fileMap[p + ".piskel"]; 
    nodeByPath.delete(p); 
    if (openTabs[p]) closeTab(p); 
  });
}
async function flattenNode(node) {
  if (!confirm(`Are you sure you want to flatten ${node.path}?`)) return;
  if (!node.isDir) return; // only works on folders

  const oldPath = node.path;
  const parentPath = oldPath.includes('/') 
    ? oldPath.slice(0, oldPath.lastIndexOf('/')) 
    : '';
  const targetBase = parentPath ? parentPath + '/' : '';

  const waiton = [];
  zip.forEach(p => {
    if (p === oldPath + '/') return;
    if (!p.startsWith(oldPath + '/')) return;
    if (p.endsWith('.piskel')) return; 
    const rel = p.slice(oldPath.length + 1); 
    const newP = targetBase + rel;
    waiton.push(moveFile(p, newP));
    waiton.push(moveFile(p + ".piskel", newP + ".piskel"));
    updateTab(p, newP);
  });
  await Promise.all(waiton);
  deleteNode(node, true);
  buildTreeFromZip(zip);
  renderTree();
}
async function downloadNode(node) {
  const blob = await zip.file(node.path).async("blob");
  var url = URL.createObjectURL(blob);
  var name = node.path.split('/').pop();
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
async function createFolder(parentNode, name) {
  const dstNode = parentNode || root;
  const dstBase=dstNode.path===''?'':(dstNode.isDir?dstNode.path:(dstNode.path.includes('/')?dstNode.path.slice(0,dstNode.path.lastIndexOf('/')):''));
  const path = dstBase ? `${dstBase}/${name}` : name;
  zip.folder(path);
  await buildFileMap(zip);
  unsavedChanges = true;
  buildTreeFromZip(zip);
  renderTree();
} 
async function createFile(parentNode, name, content = '') {
  const dstNode = parentNode || root;
  const dstBase=dstNode.path===''?'':(dstNode.isDir?dstNode.path:(dstNode.path.includes('/')?dstNode.path.slice(0,dstNode.path.lastIndexOf('/')):''));
  const path = dstBase ? `${dstBase}/${name}` : name;

function transpileModule(name, rawName, content) {
  const dependencies = [];
  const inlineExports = [];

  function resolvePath(ref) {
    if (!ref.startsWith('.') && !ref.startsWith('/')) return ref;
    try {
      const baseName = rawName.startsWith('/') ? rawName : '/' + rawName;
      const baseUrl = new URL(baseName, 'http://dummy.com');
      const resolved = new URL(ref, baseUrl);
      let finalPath = resolved.pathname;
      if (!rawName.startsWith('/') && finalPath.startsWith('/')) {
        finalPath = finalPath.slice(1);
      }
      return finalPath;
    } catch (e) {
      return ref; 
    }
  }

  // 1. Dynamic Imports
  let code = content.replace(/\bimport\s*\(\s*(["'`])([^"'`]+)\1\s*\)/g, (match, quote, path) => {
    const resolved = resolvePath(path);
    return `await requireModuleAsync("${resolved}")`;
  });

  // 2. Named Imports
  code = code.replace(/import\s*\{([^}]+)\}\s*from\s*(["'`])([^"'`]+)\2;?/g, (match, imports, quote, path) => {
    const resolved = resolvePath(path);
    dependencies.push(resolved);
    const destructured = imports.split(',').map(item => {
      let parts = item.trim().split(/\s+as\s+/);
      return parts.length === 2 ? `${parts[0]}: ${parts[1]}` : parts[0];
    }).join(', ');
    return `const { ${destructured} } = await requireModule("${resolved}");`;
  });

  // 3. Default Imports
  code = code.replace(/import\s+(?!\{|\*)([a-zA-Z_$][a-zA-Z0-9_$]*)\s+from\s*(["'`])([^"'`]+)\2;?/g, (match, varName, quote, path) => {
    const resolved = resolvePath(path);
    dependencies.push(resolved);
    return `const ${varName} = (await requireModule("${resolved}")).default;`;
  });

  // 4. Namespace Imports
  code = code.replace(/import\s*\*\s*as\s+([a-zA-Z_$][a-zA-Z0-9_$]*)\s+from\s*(["'`])([^"'`]+)\2;?/g, (match, varName, quote, path) => {
    const resolved = resolvePath(path);
    dependencies.push(resolved);
    return `const ${varName} = await requireModule("${resolved}");`;
  });

  // 5. Bare Imports
  code = code.replace(/import\s*(["'`])([^"'`]+)\1;?/g, (match, quote, path) => {
    const resolved = resolvePath(path);
    dependencies.push(resolved);
    return `await requireModule("${resolved}");`;
  });

  // --- RE-EXPORTS MOVED HERE (Processed before standard exports) ---

  // 9. Re-export All
  code = code.replace(/export\s*\*\s*from\s*(["'`])([^"'`]+)\1;?/g, (match, quote, path) => {
    const resolved = resolvePath(path);
    dependencies.push(resolved);
    return `Object.entries(await requireModule("${resolved}")).forEach(([k, v]) => { 
      if (k !== 'default') __exports__[k] = v; 
    });`;
  });
  
  // 10. Re-export Namespace
  code = code.replace(/export\s*\*\s*as\s+([a-zA-Z_$][a-zA-Z0-9_$]*)\s+from\s*(["'`])([^"'`]+)\2;?/g, (match, varName, quote, path) => {
    const resolved = resolvePath(path);
    dependencies.push(resolved);
    return `__exports__.${varName} = await requireModule("${resolved}");`;
  });

  // 11. Re-export Named
  code = code.replace(/export\s*\{([^}]+)\}\s*from\s*(["'`])([^"'`]+)\2;?/g, (match, exportsStr, quote, path) => {
    const resolved = resolvePath(path);
    dependencies.push(resolved);
    const assignments = exportsStr.split(',').map(item => {
      let parts = item.trim().split(/\s+as\s+/);
      const importedKey = parts[0].trim();
      const exportedKey = parts.length === 2 ? parts[1].trim() : importedKey;
      return `__exports__.${exportedKey} = (await requireModule("${resolved}")).${importedKey};`;
    }).join('\n');
    return assignments;
  });

  // --- STANDARD EXPORTS ---

  // 6. Named Exports (Added negative lookahead so it ignores "from")
  code = code.replace(/export\s*\{([^}]+)\}(?!\s+from);?/g, (match, exportsStr) => {
    return exportsStr.split(',').map(item => {
      let parts = item.trim().split(/\s+as\s+/);
      const key = parts.length === 2 ? parts[1].trim() : parts[0].trim();
      const val = parts[0].trim();
      return `__exports__.${key} = ${val};`;
    }).join('\n');
  });

  // 7. Default Exports
  code = code.replace(/export\s+default\s+([^;]+);?/g, (match, val) => {
    return `__exports__.default = ${val.trim()};`;
  });

  // 8. Inline Exports
  code = code.replace(/export\s+(async\s+)?(const|let|var|function|class)\s+([a-zA-Z_$][a-zA-Z0-9_$]*)/g, (match, asyncMod, type, varName) => {
    inlineExports.push(varName);
    return `${asyncMod || ''}${type} ${varName}`; 
  });

  if (inlineExports.length > 0) {
    const assignments = inlineExports.map(varName => `__exports__.${varName} = ${varName};`).join('\n');
    code += `\n\n// --- Inline Exports ---\n${assignments}`;
  }

  const finalCode = `window._registry["${name}"] = async function() {
const __exports__ = {};\n
try {
${code}
} catch(e) {
  e.fileName = "${name}";
  window.__logErrorObj(e);
}
\nreturn __exports__;
};`;
  
  // logAnything(name, finalCode);

  return {
    code: finalCode,
    dependencies: dependencies
  };
}

function parseOBJ(text) {
  const positions = [];
  const texcoords = [];
  const normals = [];
  const faces = []; // array of { v, vt, vn } indices per triangle

  const v = [];   // vec3
  const vt = [];  // vec2
  const vn = [];  // vec3

  const lines = text.split(/\r?\n/);
  for (const line of lines) {
    const s = line.trim();
    if (s === "" || s.startsWith("#")) continue;
    const parts = s.split(/\s+/);
    const tag = parts[0];

    if (tag === "v") {
      v.push([+parts[1], +parts[2], +parts[3]]);
    } else if (tag === "vt") {
      vt.push([+parts[1], +parts[2]]);
    } else if (tag === "vn") {
      vn.push([+parts[1], +parts[2], +parts[3]]);
    } else if (tag === "f") {
      const verts = parts.slice(1).map(tok => {
        const [iv, ivt, ivn] = tok.split("/");
        return {
          v: iv ? (parseInt(iv, 10) - 1) : null,
          vt: ivt ? (parseInt(ivt, 10) - 1) : null,
          vn: ivn ? (parseInt(ivn, 10) - 1) : null
        };
      });

      // Triangulate polygons (fan)
      for (let i = 1; i + 1 < verts.length; i++) {
        const tri = [verts[0], verts[i], verts[i + 1]];
        faces.push(tri);
      }
    }
  }

  // Build interleaved arrays; if missing normals/uvs, compute defaults
  const outPos = [];
  const outNor = [];
  const outUV  = [];

  // Compute face normals if vn missing
  function computeNormal(a, b, c) {
    const ax = a[0], ay = a[1], az = a[2];
    const bx = b[0], by = b[1], bz = b[2];
    const cx = c[0], cy = c[1], cz = c[2];
    const ux = bx - ax, uy = by - ay, uz = bz - az;
    const vx = cx - ax, vy = cy - ay, vz = cz - az;
    const nx = uy * vz - uz * vy;
    const ny = uz * vx - ux * vz;
    const nz = ux * vy - uy * vx;
    const len = Math.hypot(nx, ny, nz) || 1;
    return [nx / len, ny / len, nz / len];
  }

  for (const tri of faces) {
    const p = tri.map(t => v[t.v] || [0,0,0]);
    const uv = tri.map(t => (t.vt != null ? vt[t.vt] : [0,0]));
    let n = tri.map(t => (t.vn != null ? vn[t.vn] : null));
    if (n.some(x => x == null)) {
      const fn = computeNormal(p[0], p[1], p[2]);
      n = [fn, fn, fn];
    }
    for (let i = 0; i < 3; i++) {
      outPos.push(p[i][0], p[i][1], p[i][2]);
      outUV.push(uv[i][0], uv[i][1]);
      outNor.push(n[i][0], n[i][1], n[i][2]);
    }
  }

  return {
    positions: new Float32Array(outPos),
    normals: new Float32Array(outNor),
    uvs: new Float32Array(outUV),
    count: outPos.length / 3
  };
}
function computeBounds(positions) {
  let minX = Infinity, minY = Infinity, minZ = Infinity;
  let maxX = -Infinity, maxY = -Infinity, maxZ = -Infinity;

  for (let i = 0; i < positions.length; i += 3) {
    const x = positions[i], y = positions[i+1], z = positions[i+2];
    if (x < minX) minX = x;
    if (y < minY) minY = y;
    if (z < minZ) minZ = z;
    if (x > maxX) maxX = x;
    if (y > maxY) maxY = y;
    if (z > maxZ) maxZ = z;
  }

  return { minX, minY, minZ, maxX, maxY, maxZ };
}

    }
  `;
  const fsSource = `
    precision mediump float;
    varying vec3 vNormal;
    varying vec3 vWorldPos;
    uniform vec3 uLightDir;
    uniform vec3 uColor;
    void main(void) {
      vec3 N = normalize(vNormal);
      float diff = max(dot(N, normalize(uLightDir)), 0.0);
      float ambient = 0.2;
      vec3 color = uColor * (ambient + diff * 0.8);
      gl_FragColor = vec4(color, 1.0);
    }
  `;

  function compile(type, src) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    return sh;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, vsSource));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fsSource));
  gl.linkProgram(prog);

  const loc = {
    aPosition: gl.getAttribLocation(prog, "aPosition"),
    aNormal:   gl.getAttribLocation(prog, "aNormal"),
    uProj:     gl.getUniformLocation(prog, "uProj"),
    uView:     gl.getUniformLocation(prog, "uView"),
    uModel:    gl.getUniformLocation(prog, "uModel"),
    uLightDir: gl.getUniformLocation(prog, "uLightDir"),
    uColor:    gl.getUniformLocation(prog, "uColor"),
  };

  // Buffers
  const posBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
  gl.bufferData(gl.ARRAY_BUFFER, model.positions, gl.STATIC_DRAW);

  const norBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, norBuf);
  gl.bufferData(gl.ARRAY_BUFFER, model.normals, gl.STATIC_DRAW);

  // Basic state
  gl.enable(gl.DEPTH_TEST);
  gl.clearColor(0.08, 0.08, 0.1, 1);

  // Matrices
  const proj = mat4.create();
  const view = mat4.create();
  const modelMat = mat4.create();

  const aspect = canvas.clientWidth / canvas.clientHeight;
  mat4.perspective(proj, 45 * Math.PI / 180, aspect, 0.1, 100.0);
  mat4.lookAt(view, [0, 0, 4], [0, 0, 0], [0, 1, 0]);

  let angle = 0;

  function render() {
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

    angle += 0.01;
    mat4.identity(modelMat);
    mat4.rotateY(modelMat, modelMat, angle);
    mat4.rotateX(modelMat, modelMat, angle * 0.5);

    gl.useProgram(prog);
    gl.uniformMatrix4fv(loc.uProj, false, proj);
    gl.uniformMatrix4fv(loc.uView, false, view);
    gl.uniformMatrix4fv(loc.uModel, false, modelMat);
    gl.uniform3f(loc.uLightDir, -0.5, 0.8, 0.6);
    gl.uniform3f(loc.uColor, 0.7, 0.8, 1.0);

    // Positions
    gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
    gl.vertexAttribPointer(loc.aPosition, 3, gl.FLOAT, false, 0, 0);
    gl.enableVertexAttribArray(loc.aPosition);

    // Normals
    gl.bindBuffer(gl.ARRAY_BUFFER, norBuf);
    gl.vertexAttribPointer(loc.aNormal, 3, gl.FLOAT, false, 0, 0);
    gl.enableVertexAttribArray(loc.aNormal);

    gl.drawArrays(gl.TRIANGLES, 0, model.count);
    requestAnimationFrame(render);
  }

  render();
}

async function getHDRdataURLfromURL(url) {
  const exposure = 1;
  const response = await fetch(url);
  const arrayBuffer = await response.arrayBuffer();
  const hdr = parseHdr(new Uint8Array(arrayBuffer));

  const data = hdr.data; 
  const [width, height] = hdr.shape;
  
  const rgba = new Uint8ClampedArray(width * height * 4);

  for (let i = 0; i < width * height; i++) {
    // CHANGE THIS: Your data likely has an Alpha channel or padding already
    const idx = i * 4; 

    for (let c = 0; c < 3; c++) {
      let val = data[idx + c] * exposure;
      
      // Tone Mapping & Gamma (from your working class)
      val = val / (0.3 + val);
      val = Math.pow(val, 1.0 / 2.2);
      
      rgba[idx + c] = Math.max(0, Math.min(255, val * 255));
    }
    rgba[idx + 3] = 255; // Alpha
  }

  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext('2d');
  ctx.putImageData(new ImageData(rgba, width, height), 0, 0);
  
  return canvas.toDataURL("image/png");
}

const tabBar = document.getElementById("tabBar");
const editorContainer = document.getElementById("editorContainer");
var openTabs = {}; // path → { tabEl, editorEl, monacoInstance }
var activeTab = null;

function activateTab(path) {
  if (activeTab) {
    openTabs[activeTab].tabEl.classList.remove("active");
    openTabs[activeTab].editorEl.classList.remove("active");
  }
  activeTab = path;
  openTabs[path].tabEl.classList.add("active");
  openTabs[path].editorEl.classList.add("active");
}
function closeTab(path) {
  const { tabEl, editorEl, monacoInstance } = openTabs[path];
  tabEl.remove();
  editorEl.remove();
  if (monacoInstance) monacoInstance.dispose();
  delete openTabs[path];

  if (activeTab === path) {
    activeTab = null;
    const remaining = Object.keys(openTabs);
    if (remaining.length > 0) activateTab(remaining[0]);
  }
  
  if (resetFileMap) buildFileMap(zip);
}
function updateTab(srcPath,newPath,name) {
  if (activeTab === srcPath) activeTab = newPath;
  const tabInfo = openTabs[srcPath];
  if (!tabInfo) return;
  tabInfo.tabEl.firstChild.textContent = name || newPath.split('/').pop();
  tabInfo.editorEl.dataset.path = newPath;
  openTabs[newPath] = tabInfo;
  delete openTabs[srcPath];
}

  });

  function getSize(value) {
    const units = ["bytes", "KB", "MB", "GB", "TB"];
    let i = 0;
  
    while (value >= 1024 && i < units.length - 1) {
      value /= 1024;
      i++;
    }
    
    const rounded = i === 0 ? value : Math.round(value * 10) / 10;
  
    return rounded + " " + units[i];

      require(['vs/editor/editor.main'], () => {

        });
        monacoInstance.onDidChangeModelContent(() => {
          var text = monacoInstance.getValue();
          zip.file(node.path, text);
          //const base64 = btoa(unescape(encodeURIComponent(text)));
          //zip.fileMap[path] = `data:${mime};base64,${base64}`;
          resetFileMap = true;
          unsavedChanges = true;
          //
          updateTextHeader(text);
        });
        openTabs[path].monacoInstance = monacoInstance;
      });
    });
    return { editorTab, editorBody };
  }
  function addRaw(name) { 
    var { editorTab, editorBody } = addBody(name,function(editorTab,editorBody) {
      zip.file(node.path).async("string").then(text => { 
        editorBody.innerHTML = ''; 
        textarea = document.createElement('textarea');
        textarea.spellcheck = false;
        textarea.autocorrect = "off";
        textarea.autocapitalize = "off";
        textarea.className = "rawedit";
        editorBody.appendChild(textarea);
        textarea.appendChild(document.createTextNode(text));
        textarea.style.overflowY = "scroll";         
        textarea.style.whiteSpace = "pre-wrap";          textarea.onchange = function() {
          var text = textarea.value;
          zip.file(node.path, text);
          //const base64 = btoa(unescape(encodeURIComponent(text)));
          //zip.fileMap[path] = `data:${mime};base64,${base64}`;
          resetFileMap = true;
          unsavedChanges = true;
          //
          updateTextHeader(text);
        };
        updateTextHeader(text);
      });
    });
    return { editorTab, editorBody };
  }
  
  // Handle file types
  const mime = node.mime;
  if (mime == "text/markdown") {
    var converter = new showdown.Converter();
    addBody(" Preview ",function(editorTab,editorBody) {
      zip.file(node.path).async("string").then(text => {
        editorBody.innerHTML = converter.makeHtml(text);
        editorBody.style.overflowY = "scroll";
        updateTextHeader(text);

    addMonaco(" Edit ").editorTab.click();
    addRaw(" Raw ");
    if (mime == "text/html") addBody(" Preview ").editorTab.onclick = function() {
      settingsController.updateProperty("runPath",node.path);

  } else if (mime === "image/vnd.radiance") {

      editorBody.innerHTML = '';

</video>`;

  activateTab(path);

async function editWithPiskel(path,editorBody) {
  const tabInfo = openTabs[path];
  if (!tabInfo) return;

  const data = zip.fileMap[path];

  editorBody.innerHTML = "";
  // Create iframe element directly
  const embed = document.createElement("iframe");
  embed.className = "piskelEmbed";
  embed.style.maxWidth = "100%";
  embed.style.height = "100%";
  editorBody.appendChild(embed);
  
  var sprite = "";
  if (zip.file(path+".piskel")) sprite = await zip.file(path+".piskel").async("string");
  
  embed.srcdoc = compileHtml(window.piskelEditor,"index.html");
  embed.addEventListener('load', ()=>{
    var pframe = embed.contentWindow.document.getElementById("previewFrame");
    var loader = function(pskl) {
      var settings = pskl.app.settingsController;
      var saveFunction = async function() {
        settings._loadSetting.call(settings,"export");
        var canvas = settings.currentController.pngExportController.getFramesheetAsCanvas();
        var dataURI = canvas.toDataURL();
        zip.file(path,dataURI.split(",")[1],{base64:true});
        var json = pskl.app.piskelController.serialize();
        zip.file(path+".piskel",json);
        settings.closeDrawer();
        logText(`Saved ${path}`);
        unsavedChanges = true;
        await buildFileMap(zip);
      };
      pskl.app.shortcutService.addShortcut('ctrl+s', saveFunction);
      settings._loadSetting = settings.loadSetting;
      settings.loadSetting = function(s) {
        if (s == "save") return saveFunction();
        settings._loadSetting.call(settings,s);
      };
      //
      if (data.split(',')[1].length == 0) return;
      //
      if (sprite) {
        sprite = JSON.parse(sprite);
        var fps = sprite.piskel.fps;
        var piskel = sprite.piskel;
        var descriptor = new pskl.model.piskel.Descriptor(piskel.name, piskel.description, true);
        pskl.utils.serialization.Deserializer.deserialize(sprite, function (piskel) {
          piskel.setDescriptor(descriptor);
          pskl.app.piskelController.setPiskel(piskel);
          pskl.app.previewController.setFPS(fps);
        });
      } else {
        const file = base64ToFile(data, path.split("/").pop());
        pframe.contentWindow.$.publish('DIALOG_DISPLAY', {
          dialogId : 'import-image',
          initArgs : file
        });
      }
    };
    pframe.addEventListener('load',()=>{
      var interval = setInterval(()=>{
        if (!pframe.contentWindow) return clearInterval(interval);
        var pskl = pframe.contentWindow.pskl;
        if (!pskl) return;
        loader(pskl);
        clearInterval(interval);
      },10);
    });
  });
}

function base64ToFile(base64Data, filename) {
  // base64Data can be either full data URI or just the base64 string
  let arr = base64Data.split(',');
  let mime = '';
  let bstr = '';

  if (arr.length > 1) {
    // data URI form: "data:image/png;base64,...."
    mime = arr[0].match(/:(.*?);/)[1];
    bstr = atob(arr[1]);
  } else {
    // raw base64 string, default to PNG
    mime = 'image/png';
    bstr = atob(arr[0]);
  }

  let n = bstr.length;
  let u8arr = new Uint8Array(n);
  while (n--) {
    u8arr[n] = bstr.charCodeAt(n);
  }

  return new File([u8arr], filename, { type: mime });
}

function languageFromMime(mime, name) {
  const ext = name.split('.').pop()?.toLowerCase();
  const map = {
    js:'javascript', 
    ts:'typescript', 
    json:'json', 
    html:'html', 
    css:'css', 
    md:'markdown', 
    py:'python', 
    java:'java', 
    c:'c', 
    cpp:'cpp', 
    svg:'html', 
    gltf:'json', 
    frag:'cpp', 
    vert:'cpp', 
    hlsl:'cpp', 
    fx:'cpp', 
    wgsl:'wgsl',
  };
  return map[ext] || 'plaintext';
}

window.addEventListener("message", async (event) => {
  const msg = event.data;
  if (msg.type === "logger") {
    const logger = document.getElementById("logger");
    logText(msg.content);
  }
  if (msg?.type === "jszip-api") {
    const reply = {
      type: "jszip-response",
      requestId: msg.requestId
    };
    try {
      var params = msg.params;
      if (msg.action === "readFile") {
        const file = zip.file(params.path);
        if (!file) throw new Error("File not found");
        reply.result = await file.async(params.format || "string");
      } else if (msg.action === "listFiles") {
        reply.result = Object.keys(zip.files);
      } else {
        throw new Error("Unknown action");
      }
    } catch (err) {
      reply.error = err.message;
    }
    event.source.postMessage(reply, "*");
  }
}, false);

// Console functions
var CORS_ERROR = {}; // Pointer
function deepCopy(o, map = new Map()) {
  if (typeof o !== "object" || o === null) return o;
  if (map.has(o)) return map.get(o); 
  try {
    if (o?.outerHTML) return o;
    var np; 
    if (o instanceof Array) { 
      np = o.constructor.from(o); 
      np._length = o.length;
    } else { 
      np = Object.create(Object.getPrototypeOf(o));
    }
    if (o.constructor && !o.constructor.toString().includes("[native code]")) np._constructor = o.constructor;
    map.set(o, np);
    for (var i in o) if (Object.prototype.hasOwnProperty.call(o, i)) np[i] = deepCopy(o[i], map);
    return np;
  } catch(e) {
    if (e.message.includes("cross-origin")) return CORS_ERROR;
    throw e;
  }
}
function filterLogText(txt) {
  if (!txt) return document.createTextNode("");
  const frag = document.createDocumentFragment();
  for (var i in zip.fileMap) (function(i){
    const original = zip.fileMap[i];
    const parts = txt.split(original);
    if (parts.length > 1) {
      frag.appendChild(document.createTextNode(parts[0]));
      const u = document.createElement("span");
      u.addEventListener('click',()=>{
        var node = nodeByPath.get(i);
        if (node) {
          selectedNode = node;
          openFileEditor(node);
        }
      });
      u.className = "log-url";
      u.textContent = i;
      frag.appendChild(u);
      txt = parts.slice(1).join(original);
    }
  })(i);
  frag.appendChild(document.createTextNode(txt));
  return frag;
}
function logContainer(data) {

function logSingular(value) {
  const previewFrame = document.getElementById('previewFrame');
  function render(val) {
    const type = typeof val;

    function styledSpan(text, cls) {
      const span = document.createElement("span");
      span.classList.add(...["log"].concat(cls));
      try {
        span.appendChild(text);
      } catch(e) {
        span.textContent = String(text);
      }
      return span;
    }

    if (val === null) return styledSpan("null", "log-null");
    if (type === "string") return styledSpan(filterLogText(`"${val}"`), "log-string");
    if (type === "number") return styledSpan(val, "log-number");
    if (type === "boolean") return styledSpan(val, "log-boolean");
    if (type === "undefined") return styledSpan("undefined", "log-undefined");

    if (type === "function") {
      const details = document.createElement("details");
      const summary = document.createElement("summary");
      details.classList.add("log-details");
      summary.appendChild(styledSpan(val.name || "function", "log-function"));
      details.appendChild(summary);

      const pre = document.createElement("pre");
      pre.className = "log-function-source";
      pre.textContent = val.toString();
      details.appendChild(pre);
      return details;
    }

    if (type === "object") {
      if (val instanceof HTMLElement || val instanceof previewFrame.contentWindow.HTMLElement) {
        let html = "";
        try { html = val.outerHTML; } catch (e) { html = "[unrenderable element]"; }
        return styledSpan(filterLogText(html), "log-html");
      }
      let snapshot = deepCopy(val);
      if (snapshot === CORS_ERROR) return styledSpan("[CORS Error]", "log-circular");
      
      const details = document.createElement("details");
      const summary = document.createElement("summary");
      details.classList.add("log-details");
      
      if (val instanceof Promise || val instanceof previewFrame.contentWindow.Promise) {
        summary.appendChild(styledSpan("Promise", "log-promise"));
        details.appendChild(summary);
      
        // Placeholder until resolved
        const inner = document.createElement("div");
        inner.style.marginLeft = "15px";
        const status = styledSpan("[pending]", ["log-promise","log-promise-pending"]);
        inner.appendChild(status);
        details.appendChild(inner);
      
        // When promise resolves/rejects, update
        Promise.resolve(val).then(resolved => {
          status.textContent = "[resolved] ";
          status.className = "log log-promise log-promise-resolved";
          inner.appendChild(render(resolved));
        }).catch(err => {
          status.textContent = "[rejected] " + String(err);
          status.className = "log log-promise log-promise-rejected";
        });
      
        return details;
      }
      
      summary.appendChild(styledSpan(val.constructor?.name || "Object", "log-class"));
      details.appendChild(summary);

      // Deep copy snapshot
      details._logSnapshot = snapshot;
      const keys = Object.keys(snapshot);
      if (Array.isArray(snapshot) ? snapshot.length === 0 : keys.length === 0) {
        const placeholder = styledSpan("[empty]", "log-empty");
        details.appendChild(placeholder);
      } else details.addEventListener("toggle", function () {
        if (details.open && !details._populated) {
          const inner = document.createElement("div");
          inner.style.marginLeft = "15px";

          for (let prop in snapshot) {
            if (Object.prototype.hasOwnProperty.call(snapshot, prop)) {
              const line = document.createElement("div");
              line.appendChild(styledSpan(prop + ": ", "log-property"));
              line.appendChild(render(snapshot[prop]));
              inner.appendChild(line);
            }
          }

          details.appendChild(inner);
          details._populated = true;
        }
      });

      return details;
    }

    return styledSpan(String(val), "log-other");
  }
  return logContainer(render(value));
}
function logAnything() {
  for (var i in arguments) logSingular(arguments[i]);
}
function logText(msg) {
  return logContainer(filterLogText(msg));
}
function logError(msg) {
  const span = document.createElement("span");
  span.classList.add("log-error");
  span.classList.add("log");
  const frag = filterLogText(msg);
  span.appendChild(frag);
  return logContainer(span);
}
function logWarning(msg) {
  const span = document.createElement("span");
  span.classList.add("log-warning");
  span.classList.add("log");
  const frag = filterLogText(msg);
  span.appendChild(frag);
  return logContainer(span);
}
function runCommand(txt) {
  var previewFrame = document.getElementById('previewFrame');
  var comm = logText("Running: "+txt);
  comm.classList.add("log-command");
  comm.addEventListener('click',()=>{
    document.getElementById('consoleInput').value = txt;
  });
  try {
    var result = previewFrame.contentWindow.eval(txt);
    logAnything(result);
  } catch(e) {
    logError(e.message);
  }
}

var unsavedChanges = false;
window.addEventListener('beforeunload', async (event) => {
  if (!unsavedChanges) return;
  event.preventDefault();
  event.returnValue = '';
  await saveCache(); 
});


var autoSaved = 0;
async function saveCache() {
  if (!unsavedChanges) return;
  const zipb64 = await zip.generateAsync({
    type: 'base64',
    compression: 'DEFLATE'
  });
  const cache = await caches.open('project-cache');
  // Store ZIP in Cache API
  await cache.put(
    new Request('cache-zip'),
    new Response(zipb64)
  );
  // Store name + timestamp in localStorage
  localStorage.cacheName = document.getElementById('projectName').textContent;
  autoSaved = localStorage.autoSaved = Date.now();
}
async function loadCache() {
  const cache = await caches.open('project-cache');
  const zipResp = await cache.match('cache-zip');
  if (!zipResp) return false;
  const secondsAgo = Math.round((Date.now() - localStorage.autoSaved) / 1000);
  if (!confirm(`Load Cache? Saved ${secondsAgo}s ago`)) return false;
  const zipb64 = await zipResp.text();
  const cacheName = localStorage.cacheName || "Untitled Project";
  zip = await JSZip.loadAsync(zipb64, { base64: true });
  zip.fileMap = {};
  await settingsController.loadConfig();
  await openProject(zip, cacheName);
  return true;
}
setInterval(saveCache, 60 * 1000);
